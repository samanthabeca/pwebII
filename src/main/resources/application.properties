spring.application.name=pwebII

##H2database
spring.datasource.url=jdbc:h2:mem:dbname
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123

#h2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mailtrap: informe as credenciais apenas por variáveis de ambiente.
spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
clinica.url-base=${CLINICA_URL_BASE:http://localhost:8080}
clinica.email.remetente=${MAIL_FROM:no-reply@clinicasimpson.local}

##JPA
spring.jpa.hibernate.ddl-auto= create-drop
spring.jpa.show-sql= true
