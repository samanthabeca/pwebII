<!--suppress SpellCheckingInspection -->
<!--suppress ThymeleafVariablesResolveInspection -->
<th:block th:fragment="camposPessoais(placeholderNome, placeholderCpf, placeholderEmail)">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text"
               th:field="*{nome}"
               id="nome"
               class="form-control"
               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
               th:placeholder="${placeholderNome}"
               >
        <div class="invalid-feedback" th:errors="*{nome}"></div>
    </div>

    <div class="mb-3">
        <label for="cpf" class="form-label">CPF:</label>
        <input type="text"
               th:field="*{cpf}"
               id="cpf"
               class="form-control"
               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid' : ''"
               th:placeholder="${placeholderCpf}"
               maxlength="11"
               >
        <div class="invalid-feedback" th:errors="*{cpf}"></div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email"
               th:field="*{email}"
               id="email"
               class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
               th:placeholder="${placeholderEmail}"
               >
        <div class="invalid-feedback" th:errors="*{email}"></div>
    </div>
</th:block>
