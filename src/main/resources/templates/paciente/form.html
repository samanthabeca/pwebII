<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{},~{::title})}">
    <title>Cadastro de Paciente</title>
</head>

<body>
<header th:replace="~{fragments/header :: header}">

</header>
<main>
    <div class="container mt-5">
        <h1 th:text="${paciente.id == null ? 'Cadastro de Paciente' : 'Edição de Paciente'}"></h1>

        <form th:action="${paciente.id == null} ? @{/paciente/save} : @{/paciente/update}"
              th:object="${paciente}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <th:block th:replace="~{fragments/campos-pessoais :: camposPessoais(
                placeholderNome='Digite o nome do paciente',
                placeholderCpf='Digite o CPF do paciente',
                placeholderEmail='Digite o email do paciente')}"></th:block>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text"
                       th:field="*{telefone}"
                       id="telefone"
                       class="form-control"
                       placeholder="Digite o telefone"
                       required>
            </div>

            <br/>

            <input type="submit" value="Enviar" class="btn btn-primary">
            <a th:href="@{/paciente/list}" class="btn btn-success">Listar</a>
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Voltar</button>
        </form>
    </div>
</main>
</body>
</html>
