<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pacientes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>Lista de Pacientes</h1>

<!-- Exibição de mensagens tratadas -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemErro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<table class="table table-bordered table-striped align-middle mt-3">
    <thead class="table-light">
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Nome</th>
        <th scope="col">Telefone</th>
        <th scope="col" class="text-center" style="width: 200px;">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${paciente}">
        <td th:text="${p.id_paciente}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.telefone}"></td>
        <td>
            <!-- Agrupa as ações na mesma célula com Flexbox -->
            <div class="d-flex justify-content-center align-items-center gap-2">
                <a th:href="@{/paciente/edit/{id}(id=${p.id_paciente})}" class="btn btn-sm btn-outline-primary">
                    Editar
                </a>

                <form th:action="@{/paciente/remove/{id}(id=${p.id_paciente})}" method="post" class="m-0 p-0">
                    <button type="submit"
                            onclick="return confirm('Tem certeza que deseja excluir?');"
                            class="btn btn-sm btn-outline-danger">
                        Excluir
                    </button>
                </form>

                <a th:href="@{/consulta/paciente/{id}(id=${p.id_paciente})}" class="btn btn-sm btn-outline-info">
                    Consultas
                </a>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div class="mt-3">
    <a th:href="@{/paciente/form}" class="btn btn-primary">Cadastrar</a>
    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
