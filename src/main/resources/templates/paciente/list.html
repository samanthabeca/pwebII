<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{},~{::title})}">
    <title>Lista de Pacientes</title>
</head>

<body>
<header th:replace="~{fragments/header :: header}">

</header>
<main>

    <div class="container mt-5">
        <h1>Lista de Pacientes</h1>

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <div class="table-responsive-md mt-3">
        <table class="table table-bordered table-striped align-middle mb-0">

            <thead class="table-light">
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Nome</th>
                <th scope="col">CPF</th>
                <th scope="col">Telefone</th>
                <th scope="col">Email</th>
                <th scope="col" class="text-center" style="width: 200px;">Ações</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${paciente}">

                <td th:text="${p.id}"></td>

                <td th:text="${p.nome}"></td>

                <td th:text="${p.cpf}"></td>

                <td th:text="${p.telefone}"></td>

                <td th:text="${p.email}"></td>

                <td>
                    <div class="d-flex justify-content-center align-items-center gap-2">

                        <a th:href="@{/paciente/edit/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary">
                            Editar
                        </a>

                        <form th:action="@{/paciente/remove/{id}(id=${p.id})}"
                              method="post"
                              class="m-0 p-0">

                            <button type="submit"
                                    onclick="return confirm('Tem certeza que deseja excluir?');"
                                    class="btn btn-sm btn-outline-danger">
                                Excluir
                            </button>

                        </form>

                        <a th:href="@{/consulta/paciente/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-info">
                            Consultas
                        </a>

                    </div>
                </td>

            </tr>

            </tbody>

        </table>
        </div>

        <div class="mt-3">
            <a th:href="@{/paciente/form}" class="btn btn-primary">Cadastrar</a>
            <a th:href="@{/}" class="btn btn-secondary">Início</a>
        </div>

    </div>

</main>
</body>
</html>
