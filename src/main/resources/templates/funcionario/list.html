<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Funcionários</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>Lista de Funcionários</h1>

<!-- Mensagens de erro e sucesso -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemErro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<table class="table table-bordered table-striped align-middle mt-3">
    <thead class="table-light">
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Salário</th>
        <th>Departamento</th>
        <th class="text-center" style="width: 200px;">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="f : ${funcionario}">
        <td th:text="${f.id}"></td>
        <td th:text="${f.nome}"></td>
        <!-- Formatação de moeda em R$ -->
        <td th:text="${'R$ ' + #numbers.formatDecimal(f.salario, 1, 'POINT', 2, 'COMMA')}"></td>
        <!-- Exibe o nome do departamento associado (com tratamento para caso venha nulo) -->
        <td th:text="${f.departamento != null ? f.departamento.nome : 'Sem Departamento'}"></td>
        <td>
            <div class="d-flex justify-content-center align-items-center gap-2">
                <a th:href="@{/funcionario/edit/{id}(id=${f.id})}" class="btn btn-sm btn-outline-primary">
                    Editar
                </a>

                <form th:action="@{/funcionario/remove/{id}(id=${f.id})}" method="post" class="m-0 p-0">
                    <button type="submit"
                            onclick="return confirm('Tem certeza que deseja excluir este funcionário?');"
                            class="btn btn-sm btn-outline-danger">
                        Excluir
                    </button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div class="mt-3">
    <a th:href="@{/funcionario/form}" class="btn btn-primary">Cadastrar</a>
    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
