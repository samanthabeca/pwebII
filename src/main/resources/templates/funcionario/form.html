<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form de Funcionário</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="${funcionario.id == null ? 'Cadastro de Funcionário' : 'Edição de Funcionário'}"></h1>

<!-- Exibição de mensagens tratadas -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemErro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<form th:action="${funcionario.id == null} ? @{/funcionario/save} : @{/funcionario/update}"
      th:object="${funcionario}"
      method="post"
      class="mt-4">

    <input type="hidden" th:field="*{id}">

    <!-- Campo Nome em linha própria -->
    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome do funcionário" required>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="departamento" class="form-label">Departamento:</label>
            <select th:field="*{departamento.id}" id="departamento" class="form-select" required>
                <option value="">-- Selecione um Departamento --</option>
                <option th:each="d : ${departamento}"
                        th:value="${d.id}"
                        th:text="${d.nome}">
                </option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label for="salario" class="form-label">Salário (R$):</label>
            <input type="number" step="0.01" id="salario" placeholder="0.00" th:field="*{salario}" class="form-control"
                   required>
        </div>
    </div>

    <div class="mt-3">
        <input type="submit" value="Enviar" class="btn btn-primary">
        <a th:href="@{/funcionario/list}" class="btn btn-success">Listar</a>
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </div>
</form>

</body>
</html>
