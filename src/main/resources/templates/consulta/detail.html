<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{},~{::title})}">
    <title>Detalhes da Consulta</title>
</head>

<body>
<header th:replace="~{fragments/header :: header}">

</header>
<main>
    <div class="container mt-5">

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Detalhes da Consulta #<span th:text="${consulta.id_consulta}"></span></h3>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Paciente:</strong>
                        <p class="fs-5" th:text="${consulta.paciente.nome}"></p>
                    </div>
                    <div class="col-md-6">
                        <strong>Médico:</strong>
                        <p class="fs-5" th:text="${consulta.medico.nome}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Data e hora:</strong>
                        <p th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy - HH:mm')}"></p>
                    </div>
                    <div class="col-md-6">
                        <strong>Valor:</strong>
                        <p th:text="${'R$ ' + #numbers.formatDecimal(consulta.valor, 1, 'POINT', 2, 'COMMA')}"></p>
                    </div>
                </div>

                <div class="mb-3">
                    <strong>Observação:</strong>
                    <p class="text-muted" th:text="${consulta.observacao}"></p>
                </div>
            </div>
            <div class="card-footer">
                <a th:href="@{/consulta/edit/{id}(id=${consulta.id_consulta})}" class="btn btn-warning">Editar</a>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Voltar</button>
            </div>
        </div>

    </div>
</main>
</body>
</html>
