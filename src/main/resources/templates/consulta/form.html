<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form de Consulta</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="${consulta.id_consulta == null ? 'Cadastro de Consulta' : 'Edição de Consulta'}"></h1>

<!-- Exibição de mensagens tratadas -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemErro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<form th:action="${consulta.id_consulta == null} ? @{/consulta/save} : @{/consulta/update}"
      th:object="${consulta}"
      method="post"
      class="mt-4">

    <input type="hidden" th:field="*{id_consulta}">

    <div class="mb-3">
        <label for="data" class="form-label">Data da Consulta:</label>
        <input type="datetime-local" th:field="*{data}" id="data" class="form-control" required>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="medico" class="form-label">Médico:</label>
            <select th:field="*{medico.id_medico}" id="medico" class="form-select" required>
                <option value="">-- Selecione um Médico --</option>
                <option th:each="m : ${medico}"
                        th:value="${m.id_medico}"
                        th:text="${m.nome}">
                </option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <select th:field="*{paciente.id_paciente}" id="paciente" class="form-select" required>
                <option value="">-- Selecione um Paciente --</option>
                <option th:each="p : ${paciente}"
                        th:value="${p.id_paciente}"
                        th:text="${p.nome}">
                </option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label for="valor" class="form-label">Valor:</label>
        <input type="number" th:field="*{valor}" id="valor" class="form-control" placeholder="Digite o valor da consulta" required>
    </div>
    <div class="mb-3">
        <label for="observacao" class="form-label">Observação:</label>
        <input type="text" th:field="*{observacao}" id="observacao" class="form-control" placeholder="Digite o observação da consulta" required>
    </div>

    <div class="mt-3">
        <input type="submit" value="Enviar" class="btn btn-primary">
        <a th:href="@{/consulta/list}" class="btn btn-success">Listar</a>
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </div>
</form>

</body>
</html>
