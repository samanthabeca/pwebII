<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{},~{::title})}">
    <title>Cadastro de Consulta de Encaixe</title>
</head>

<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="container mt-5">
        <h1>Cadastro de Consulta de Encaixe</h1>
        <p class="text-muted">Use apenas após confirmar presencialmente o comparecimento do paciente.</p>

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <form th:action="@{/consulta/save}" th:object="${cadastroConsulta}" method="post" class="mt-4">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
            </div>

            <div class="mb-3">
                <label for="agendaId" class="form-label">Horário disponível para encaixe:</label>
                <select th:field="*{agendaId}" id="agendaId" class="form-select"
                        th:classappend="${#fields.hasErrors('agendaId')} ? 'is-invalid' : ''">
                    <option value="">-- Selecione um horário --</option>
                    <option th:each="a : ${agenda}" th:value="${a.id_agenda}"
                            th:text="${a.medico.nome + ' — ' + #temporals.format(a.data, 'dd/MM/yyyy') + ' às ' + #temporals.format(a.horario, 'HH:mm')}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{agendaId}"></div>
            </div>

            <div class="mb-3">
                <label for="pacienteId" class="form-label">Paciente:</label>
                <select th:field="*{pacienteId}" id="pacienteId" class="form-select"
                        th:classappend="${#fields.hasErrors('pacienteId')} ? 'is-invalid' : ''">
                    <option value="">-- Selecione um paciente --</option>
                    <option th:each="p : ${paciente}" th:value="${p.id}" th:text="${p.nome}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{pacienteId}"></div>
            </div>

            <div class="mb-3">
                <label for="valor" class="form-label">Valor:</label>
                <input type="number" th:field="*{valor}" id="valor" class="form-control"
                       th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid' : ''"
                       min="0.01" step="0.01" placeholder="Digite o valor da consulta">
                <div class="invalid-feedback" th:errors="*{valor}"></div>
            </div>

            <div class="mb-3">
                <label for="observacao" class="form-label">Observação:</label>
                <input type="text" th:field="*{observacao}" id="observacao" class="form-control"
                       th:classappend="${#fields.hasErrors('observacao')} ? 'is-invalid' : ''"
                       maxlength="500" placeholder="Digite a observação da consulta">
                <div class="invalid-feedback" th:errors="*{observacao}"></div>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{presencaConfirmada}" id="presencaConfirmada" class="form-check-input"
                       th:classappend="${#fields.hasErrors('presencaConfirmada')} ? 'is-invalid' : ''">
                <label for="presencaConfirmada" class="form-check-label">Confirmo que o paciente compareceu à clínica.</label>
                <div class="invalid-feedback" th:errors="*{presencaConfirmada}"></div>
            </div>

            <div class="mt-3">
                <input type="submit" value="Cadastrar consulta" class="btn btn-primary">
                <a th:href="@{/consulta/list}" class="btn btn-success">Listar</a>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Voltar</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
