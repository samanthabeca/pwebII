<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Consultas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1 th:text="${paciente != null} ? 'Lista de Consultas - Paciente: ' + ${paciente.nome} :
    (${medico != null} ? 'Lista de Consultas - Médico(a): ' + ${medico.nome} : 'Lista de Consultas')"></h1>

<!-- Mensagens de erro e sucesso -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemErro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<table class="table table-bordered table-striped align-middle mt-3">
    <thead class="table-light">
    <tr>
        <th>Id</th>
        <th>Data</th>
        <th>Médico</th>
        <th>Paciente</th>
        <th>Valor</th>
        <th class="text-center" style="width: 200px;">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${consulta}">
        <td th:text="${c.id_consulta}"></td>
        <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy - HH:mm')}"></td>
        <!-- Exibe o nome do médico associado (com tratamento para caso venha nulo) -->
        <td th:text="${c.medico != null ? c.medico.nome : 'Sem Médico'}"></td>
        <!-- Exibe o nome do paciente associado (com tratamento para caso venha nulo) -->
        <td th:text="${c.paciente != null ? c.paciente.nome : 'Sem Paciente'}"></td>
        <!-- Formatação de moeda em R$ -->
        <td th:text="${'R$ ' + #numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></td>
        <td>
            <div class="d-flex justify-content-center align-items-center gap-2">
                <a th:href="@{/consulta/edit/{id}(id=${c.id_consulta})}" class="btn btn-sm btn-outline-primary">
                    Editar
                </a>

                <form th:action="@{/consulta/remove/{id}(id=${c.id_consulta})}" method="post" class="m-0 p-0">
                    <button type="submit"
                            onclick="return confirm('Tem certeza que deseja excluir esta consulta?');"
                            class="btn btn-sm btn-outline-danger">
                        Excluir
                    </button>
                </form>

                <a th:href="@{/consulta/{id}(id=${c.id_consulta})}" class="btn btn-sm btn-outline-info">
                    Detalhes
                </a>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div class="mt-3">
    <a th:href="@{/consulta/form}" class="btn btn-primary">Cadastrar</a>
    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
