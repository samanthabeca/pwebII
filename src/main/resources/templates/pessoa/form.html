<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form de Pessoa</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="${pessoa.id == null ? 'Cadastro de Pessoa' : 'Edição de Pessoa'}"></h1>

<form th:action="${pessoa.id == null} ? @{/pessoa/save} : @{/pessoa/update}" th:object="${pessoa}" method="post">
    <!-- ID da Pessoa -->
    <input type="hidden" th:field="*{id}">

    <!-- ID do Endereço (Essencial para atualizações) -->
    <input type="hidden" th:field="*{endereco.id_endereco}">

    <!-- Dados Pessoais -->
    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome da pessoa" required>
    </div>

    <div class="mb-3">
        <label for="idade" class="form-label">Idade:</label>
        <input type="number" th:field="*{idade}" id="idade" class="form-control" placeholder="Digite a idade" min="0" required>
    </div>

    <h4 class="mt-4">Endereço</h4>
    <hr/>

    <!-- Dados do Endereço -->
    <div class="mb-3">
        <label for="logradouro" class="form-label">Logradouro:</label>
        <input type="text" th:field="*{endereco.logradouro}" id="logradouro" class="form-control" placeholder="Rua, Avenida, etc.">
    </div>

    <div class="mb-3">
        <label for="bairro" class="form-label">Bairro:</label>
        <input type="text" th:field="*{endereco.bairro}" id="bairro" class="form-control" placeholder="Digite o bairro">
    </div>

    <div class="mb-3">
        <label for="cep" class="form-label">CEP:</label>
        <input type="text" th:field="*{endereco.cep}" id="cep" class="form-control" placeholder="00000-000">
    </div>

    <div class="mt-4">
        <input type="submit" value="Enviar" class="btn btn-primary">
        <a th:href="@{/pessoa/list}" class="btn btn-success">Listar</a>
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </div>
</form>

</body>
</html>
