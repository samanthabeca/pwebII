<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form de Pessoa</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="${pessoa.id == null ? 'Cadastro de Pessoa' : 'Edição de Pessoa'}"></h1>


<form th:action="${pessoa.id == null} ? @{/pessoa/save} : @{/pessoa/update}" th:object="${pessoa}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control"  placeholder="Digite o nome da pessoa" required>
    </div>
    <br/><br/>

    <input type="submit" value="Enviar" class="btn btn-primary">
    <a th:href="@{/pessoa/list}" class="btn btn-success">Listar</a>
    <a th:href="@{/}" class="btn btn btn-secondary">Voltar</a></form></form>
</body>
</html>
