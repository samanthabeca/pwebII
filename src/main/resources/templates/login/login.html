<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-5 col-lg-4">

            <div th:if="${param.error}" class="alert alert-danger">Usuário ou senha inválidos.</div>
            <div th:if="${param.logout}" class="alert alert-success">Você saiu do sistema.</div>

            <div class="card shadow-sm">
                <h1 class="card-header h5">Informe usuário e senha</h1>
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input id="username" name="username" class="form-control"
                                   required autofocus autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input id="password" name="password" type="password" class="form-control"
                                   required autocomplete="current-password">
                        </div>
                        <div class="form-check mb-3">
                            <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                            <label for="remember-me" class="form-check-label">Lembrar de mim</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>
</body>
</html>
