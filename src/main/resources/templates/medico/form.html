<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form de Médico</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="${medico.id_medico == null ? 'Cadastro de Médico' : 'Edição de Médico'}"></h1>

<form th:action="${medico.id_medico == null} ? @{/medico/save} : @{/medico/update}" th:object="${medico}" method="post">
    <input type="hidden" th:field="*{id_medico}">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome do médico" required>
    </div>
    <div class="mb-3">
        <label for="crm" class="form-label">CRM:</label>
        <input type="text" th:field="*{crm}" id="crm" class="form-control" placeholder="Digite o CRM" required>
    </div>
    <br/><br/>

    <input type="submit" value="Enviar" class="btn btn-primary">
    <a th:href="@{/medico/list}" class="btn btn-success">Listar</a>
    <a th:href="@{/}" class="btn btn btn-secondary">Voltar</a>
</form>
</body>
</html>
