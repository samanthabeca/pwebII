<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{},~{::title})}">
    <title>Meu Perfil</title>
</head>

<body>
<main>
    <div class="container mt-5">
        <h1>Meu Perfil</h1>

        <div th:replace="~{fragments/mensagens :: mensagens}"></div>

        <form th:action="@{/perfil}" th:object="${perfil}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
            </div>

            <th:block th:replace="~{fragments/campos-pessoais :: camposPessoais(
                placeholderNome='Digite seu nome',
                placeholderCpf='Digite seu CPF',
                placeholderEmail='Digite seu e-mail')}"></th:block>

            <div class="mb-3" th:if="${tipoPerfil == 'PACIENTE'}">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text" th:field="*{telefone}" id="telefone" class="form-control"
                       th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid' : ''"
                       placeholder="Digite seu telefone" maxlength="11">
                <div class="invalid-feedback" th:errors="*{telefone}"></div>
            </div>

            <div class="mb-3" th:if="${tipoPerfil == 'MEDICO'}">
                <label for="crm" class="form-label">CRM:</label>
                <input type="text" th:field="*{crm}" id="crm" class="form-control"
                       th:classappend="${#fields.hasErrors('crm')} ? 'is-invalid' : ''"
                       placeholder="Digite seu CRM" maxlength="9">
                <div class="invalid-feedback" th:errors="*{crm}"></div>
            </div>

            <div class="mb-3" th:if="${tipoPerfil == 'MEDICO'}">
                <label for="especialidadeId" class="form-label">Especialidade:</label>
                <select th:field="*{especialidadeId}" id="especialidadeId" class="form-select"
                        th:classappend="${#fields.hasErrors('especialidadeId')} ? 'is-invalid' : ''">
                    <option value="">-- Selecione uma especialidade --</option>
                    <option th:each="e : ${especialidade}" th:value="${e.id_especialidade}" th:text="${e.nome}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{especialidadeId}"></div>
            </div>

            <br/>

            <input type="submit" value="Salvar" class="btn btn-primary">
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Voltar</button>
        </form>
    </div>
</main>
</body>
</html>
